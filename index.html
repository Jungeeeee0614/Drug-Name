<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Autonomic Pharmacology Two-Stage Mastery</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f3f4;
            overflow-x: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            padding: 15px;
        }

        header {
            text-align: center;
            margin-bottom: 15px;
            flex-shrink: 0;
        }
        h1 { color: #2c3e50; margin: 0 0 5px 0; font-size: 1.6rem; }
        p { color: #7f8c8d; margin: 0; font-size: 0.95rem; font-weight: bold; }
        #phase-indicator {
            display: inline-block;
            background-color: #d2dae2;
            color: #2c3e50;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            margin-top: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        #game-container {
            display: flex;
            flex-direction: column;
            flex-grow: 1; 
            width: 100%;
            gap: 15px;
            min-height: 0;
        }
        
        #cards-pool {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 15px;
            background: #ffffff;
            border: 2px dashed #b2bec3;
            border-radius: 8px;
            min-height: 80px;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }
        
        .drug-card {
            background-color: #0984e3;
            color: white;
            padding: 10px 16px;
            border-radius: 20px;
            cursor: grab;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.11);
            user-select: none;
            -webkit-user-select: none;
            font-size: 0.95rem;
            touch-action: none;
        }
        .drug-card:active { cursor: grabbing; }
        
        #classes-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
            flex-grow: 1;
            min-height: 0; 
            overflow-y: auto;
            padding-bottom: 10px;
        }
        
        .class-bucket {
            background-color: #ffffff;
            border: 2px solid #dfe6e9;
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: background 0.2s;
            min-height: 140px;
        }
        .class-bucket h3 {
            margin: 0 0 5px 0;
            text-align: center;
            color: #2d3436;
            border-bottom: 2px solid #00b894;
            padding-bottom: 5px;
            font-size: 1rem;
        }
        .drag-over { background-color: #e8f8f5; border-color: #00b894; }

        /* Subcategories (Phase 2 mini-boxes) styling */
        .sub-zone {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 5px;
            background: #f8f9fa;
            padding: 8px;
            border-radius: 6px;
            border: 1px dashed #b2bec3;
        }
        .sub-bucket {
            background-color: #ffffff;
            border: 1.5px solid #dcdde1;
            border-radius: 6px;
            padding: 8px;
            min-height: 45px;
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            align-content: flex-start;
        }
        .sub-bucket-title {
            font-size: 0.75rem;
            font-weight: bold;
            color: #7f8c8d;
            margin-bottom: 2px;
            text-transform: uppercase;
        }
        
        #footer-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 10px;
            border-top: 1px solid #dcdde1;
            margin-top: auto;
            flex-shrink: 0;
        }
        #score-board {
            font-size: 1.1rem;
            font-weight: bold;
            color: #27ae60;
        }
        .reset-btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Autonomic Two-Stage Mastery</h1>

    </header>

    <div id="game-container">

            <div class="class-bucket" data-class="Alpha1 Antagonist">

            <div class="class-bucket" data-class="Alpha2 Agonist">

                <div class="sub-zone" style="display:none;"></div>

        </div>
    </div>
