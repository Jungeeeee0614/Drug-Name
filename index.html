<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autonomic Pharm Boards Matcher</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <header>
        <h1>🧠 Autonomic Pharm Matcher</h1>
        <p>Drag the drug card into its correct functional class box out of all 13 categories.</p>
    </header>

    <div class="score-board">
        Accuracy: <span id="score">0</span> / <span id="total">0</span>
    </div>

    <div class="drug-zone">
        <div id="drug-card" class="drug-card" draggable="true">Loading...</div>
    </div>

    <div class="class-grid" id="class-grid">
        <!-- All 13 target boxes load statically here -->
    </div>

    <div class="controls">
        <button id="next-btn" disabled>Next Medication</button>
        <div id="feedback" class="feedback"></div>
        <div id="pearl-box" class="pearl-box"></div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
